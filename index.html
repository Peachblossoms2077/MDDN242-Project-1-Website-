<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ha Dao • User Experience Designer • Portfolio</title>

  <meta name="description" content="A 3D bubble menu portfolio for Ha Dao.">

  <link rel="stylesheet" href="styles.css">

  <style>
    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <!-- Three.js (non-module) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>
<body>

  <header class="hud" aria-label="Site header">
    <div class="hud__title">
      <h1 class="title">Ha Dao</h1>
      <p class="subtitle">User Experience Designer • Portfolio</p>
    </div>

    <div class="hud__help" aria-label="Controls">
      <div class="chip">Right drag: pan</div>
      <div class="chip">Scroll: zoom</div>
    </div>
  </header>

  <main id="main-content">
    <canvas id="scene" aria-label="3D bubble menu canvas"></canvas>

    <div class="breadcrumbs" aria-live="polite" aria-atomic="true">
      <span class="breadcrumbs__label">Path:</span>
      <span id="crumbs">Ha Dao</span>
    </div>
  </main>

  <div class="recenter-wrap">
    <button id="recenter" class="recenter-btn" type="button" aria-label="Recenter view">Recenter View</button>
  </div>

  <footer class="footer">
    <small>&copy; <span id="year"></span> Ha Dao</small>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script src="script.js"></script>
</body>
</html>
